name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Do not interrupt a main release between publishing the package and tagging it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build, test and verify publication metadata
        run: ./gradlew build generatePomFileForMavenJavaPublication --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/reports/

  release-gate:
    name: Check main push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    uses: yola-org/shared-workflows/.github/workflows/reusable-release-gate.yml@main
    with:
      base-branch: main
      require-merged-pr: false

  version:
    name: Calculate version
    needs: release-gate
    if: ${{ needs.release-gate.outputs.release == 'true' }}
    permissions:
      contents: write
    uses: yola-org/shared-workflows/.github/workflows/reusable-version.yml@main
    with:
      prefix: v
      initial: '0.1.0'
      tag: false

  publish:
    name: Publish GitHub Package
    needs: [verify, release-gate, version]
    if: ${{ needs.release-gate.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish calculated version
        run: ./gradlew publish -Pversion="$RELEASE_VERSION" --no-daemon
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag:
    name: Tag published release
    needs: [version, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create and push release tag
        uses: yola-org/shared-workflows/.github/actions/version-tag@main
        with:
          version: ${{ needs.version.outputs.version }}
          git-tag: ${{ needs.version.outputs.git_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
